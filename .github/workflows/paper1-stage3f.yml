name: Paper1 Stage3F Legal Validation

on:
  workflow_dispatch:

jobs:
  stage3f:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::fixest
            any::broom

      - name: Run Stage 3F
        run: Rscript R/run_stage3f.R

      - name: Show Stage 3F summary
        if: always()
        run: |
          echo "===== STAGE 3F SUMMARY ====="
          cat outputs/stage3f_legal_validation/STAGE3F_SUMMARY.md || true
          echo "===== MAIN LEGAL RESULTS ====="
          cat outputs/stage3f_legal_validation/03_confirmatory_legal_results.csv || true
          echo "===== LOO COUNTRY ====="
          cat outputs/stage3f_legal_validation/06_legal_leave_one_country_out_summary.csv || true
          echo "===== LOO YEAR ====="
          cat outputs/stage3f_legal_validation/08_legal_leave_one_year_out_summary.csv || true
          echo "===== WILD CLUSTER ====="
          cat outputs/stage3f_legal_validation/10_legal_wild_cluster_results.csv || true

      - name: Upload Stage 3F artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-stage3f-legal-validation
          path: outputs/stage3f_legal_validation/
          if-no-files-found: warn
          retention-days: 30
