name: Paper1 Stage3D Legal Architecture

on:
  workflow_dispatch:

jobs:
  stage3d:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::stringr
            any::tidyr
            any::fixest
            any::broom

      - name: Run Stage 3D
        run: Rscript R/run_stage3d.R

      - name: Show Stage 3D summary
        if: always()
        run: |
          echo "===== STAGE 3D SUMMARY ====="
          cat outputs/stage3d_legal_architecture/STAGE3D_SUMMARY.md || true
          echo "===== LEGAL FIELD CANDIDATES ====="
          cat outputs/stage3d_legal_architecture/01_legal_field_candidates.csv || true
          echo "===== LEGAL GPR COEFFICIENTS ====="
          cat outputs/stage3d_legal_architecture/09_legal_architecture_gpr_coefficients.csv || true
          echo "===== MANUAL REVIEW READINESS ====="
          cat outputs/stage3d_legal_architecture/10_manual_classification_readiness.csv || true

      - name: Upload Stage 3D artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-stage3d-legal-architecture
          path: outputs/stage3d_legal_architecture/
          if-no-files-found: warn
          retention-days: 30
