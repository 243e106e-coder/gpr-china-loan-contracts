name: Paper1 Stage3H FWL Cluster Influence Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage3h-fwl-cluster-influence:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::purrr
            any::fixest
            any::broom
            any::ggplot2

      - name: Locate latest successful Stage 3G run
        id: stage3g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow paper1-stage3g.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Stage 3G workflow run found."
            exit 1
          fi
          echo "Found Stage 3G run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Stage 3G artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.stage3g.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p outputs/stage3g_final_inference
          gh run download "$RUN_ID"             --name paper1-stage3g-final-inference             --dir outputs/stage3g_final_inference
          echo "===== DOWNLOADED STAGE 3G FILES ====="
          find outputs/stage3g_final_inference -maxdepth 2 -type f -print | sort

      - name: Check FWL audit script
        run: |
          set -euo pipefail
          test -f R/58_fwl_cluster_influence_audit.R
          echo "FWL cluster influence script found."
          head -n 15 R/58_fwl_cluster_influence_audit.R

      - name: Check Stage 3G inputs
        run: |
          set -euo pipefail
          OUTDIR="outputs/stage3g_final_inference"
          required_files=(
            "$OUTDIR/01_financial_final_data.csv"
            "$OUTDIR/02_legal_final_data.csv"
            "$OUTDIR/03_final_hypotheses.csv"
            "$OUTDIR/04_final_clustered_results.csv"
          )
          for f in "${required_files[@]}"; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
              find "$OUTDIR" -maxdepth 3 -type f -print | sort || true
              exit 1
            fi
          done

      - name: Check installed R packages
        run: |
          Rscript -e '
          pkgs <- c("readr","dplyr","tidyr","fixest","ggplot2")
          missing <- pkgs[!vapply(pkgs, requireNamespace, quietly=TRUE, FUN.VALUE=logical(1))]
          if (length(missing) > 0) stop(paste("Missing R packages:", paste(missing, collapse=", ")))
          cat("All required R packages are available.\n")
          '

      - name: Run FWL cluster influence audit
        run: |
          set -euo pipefail
          Rscript R/58_fwl_cluster_influence_audit.R

      - name: Verify Stage 3H outputs
        run: |
          set -euo pipefail
          AUDIT_DIR="outputs/stage3g_final_inference/cluster_influence_gpr_audit"
          find "$AUDIT_DIR" -maxdepth 1 -type f -print | sort
          required_outputs=(
            "$AUDIT_DIR/00_cluster_influence_summary.csv"
            "$AUDIT_DIR/01_all_country_gpr_variation.csv"
            "$AUDIT_DIR/02_all_year_gpr_variation.csv"
            "$AUDIT_DIR/03_all_leave_one_country_influence.csv"
            "$AUDIT_DIR/04_all_leave_one_year_influence.csv"
          )
          for f in "${required_outputs[@]}"; do
            test -f "$f" || { echo "MISSING OUTPUT: $f"; exit 1; }
          done

      - name: Show cluster influence summary
        if: always()
        run: |
          AUDIT_DIR="outputs/stage3g_final_inference/cluster_influence_gpr_audit"
          if [ -f "$AUDIT_DIR/00_cluster_influence_summary.csv" ]; then
            cat "$AUDIT_DIR/00_cluster_influence_summary.csv"
          else
            echo "00_cluster_influence_summary.csv not generated."
          fi

      - name: Upload Stage 3H artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-stage3h-fwl-cluster-influence
          path: outputs/stage3g_final_inference/cluster_influence_gpr_audit/
          if-no-files-found: warn
          retention-days: 30
