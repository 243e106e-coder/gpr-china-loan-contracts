name: Paper1 Stage3H Cluster Influence Audit

on:
  workflow_dispatch:

jobs:
  stage3h-cluster-influence:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::purrr
            any::fixest
            any::broom

      - name: Check Stage 3H script
        run: |
          test -f R/57_cluster_influence_gpr_audit.R
          echo "Stage 3H cluster influence script found."

      - name: Check master dataset
        run: |
          echo "===== MASTER DATASET CANDIDATES ====="
          find outputs -type f -name "09_stage2b_master_dataset.csv" -print || true

      - name: Run Stage 3H cluster influence audit
        run: Rscript R/57_cluster_influence_gpr_audit.R

      - name: Show summary
        if: always()
        run: |
          echo "===== STAGE 3H SUMMARY ====="
          cat outputs/stage3h_cluster_influence/STAGE3H_SUMMARY.md || true
          echo "===== FWL CONCENTRATION ====="
          cat outputs/stage3h_cluster_influence/01_fwl_concentration_summary.csv || true

      - name: Upload Stage 3H artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-stage3h-cluster-influence
          path: outputs/stage3h_cluster_influence/
          if-no-files-found: warn
          retention-days: 30
