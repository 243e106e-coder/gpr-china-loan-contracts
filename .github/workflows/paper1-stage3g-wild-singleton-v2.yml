name: Paper1 Stage3G Wild Cluster Singleton Fix V2

on:
  workflow_dispatch:

jobs:
  wildcluster-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Setup dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::fixest
            any::broom

      - name: Install fwildclusterboot
        run: |
          Rscript -e 'options(repos=c(s3alfisc="https://s3alfisc.r-universe.dev",CRAN="https://cloud.r-project.org")); install.packages("fwildclusterboot",dependencies=TRUE); stopifnot(requireNamespace("fwildclusterboot",quietly=TRUE)); cat("fwildclusterboot version:",as.character(packageVersion("fwildclusterboot")),"\n")'

      - name: Run singleton-safe bootstrap V2
        run: Rscript R/run_stage3g_wild_singleton_v2.R

      - name: Show audit
        if: always()
        run: |
          echo "===== NEW V2 SAMPLE AUDIT ====="
          cat outputs/stage3g_final_inference/06a_wildcluster_sample_audit.csv || true
          echo "===== NEW V2 WILD RESULTS ====="
          cat outputs/stage3g_final_inference/06_final_wild_cluster_results.csv || true
          echo "===== NEW V2 FINAL TABLE ====="
          cat outputs/stage3g_final_inference/12_final_results_table.csv || true
          echo "===== NEW V2 SUMMARY ====="
          cat outputs/stage3g_final_inference/STAGE3G_SUMMARY.md || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-stage3g-wild-singleton-v2
          path: outputs/stage3g_final_inference/
          if-no-files-found: warn
          retention-days: 30
