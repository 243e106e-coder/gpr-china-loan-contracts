name: Paper1 Stage3 GPR Baseline

on:
  workflow_dispatch:

jobs:
  stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::readxl
            any::dplyr
            any::tidyr
            any::stringr
            any::lubridate
            any::janitor
            any::fixest
            any::broom

      - name: Run Stage 3
        run: Rscript R/run_stage3.R

      - name: Show Stage 3 summary
        if: always()
        run: |
          echo "===== STAGE 3 SUMMARY ====="
          cat outputs/stage3_gpr_baseline/STAGE3_SUMMARY.md || true
          echo "===== BASELINE COEFFICIENTS ====="
          cat outputs/stage3_gpr_baseline/10_gpr_baseline_coefficients.csv || true

      - name: Upload Stage 3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-stage3-gpr-baseline
          path: outputs/stage3_gpr_baseline/
          if-no-files-found: warn
          retention-days: 30
