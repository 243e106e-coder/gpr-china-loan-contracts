name: Paper1 Stage3K Philippines Contract Audit v2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage3k-philippines-contract-audit-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
      - name: Download latest successful Stage 3G artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow paper1-stage3g.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" && test "$run_id" != "null"
          mkdir -p outputs/stage3g_final_inference
          gh run download "$run_id" --name paper1-stage3g-final-inference --dir outputs/stage3g_final_inference
      - name: Run Philippines contract audit v2
        run: Rscript R/62_philippines_contract_audit_v2.R
      - name: Show summary
        if: always()
        run: cat outputs/stage3k_philippines_contract_audit_v2/STAGE3K_V2_SUMMARY.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper1-stage3k-philippines-contract-audit-v2
          path: outputs/stage3k_philippines_contract_audit_v2/
          if-no-files-found: warn
          retention-days: 30
