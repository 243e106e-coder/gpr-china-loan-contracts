name: Paper1 Stage1.5 Substantive Field Audit

on:
  workflow_dispatch:

jobs:
  substantive-field-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::readxl
            any::dplyr
            any::tidyr
            any::stringr
            any::purrr
            any::janitor

      - name: Check script
        run: |
          test -f R/21_stage1_5_substantive_field_audit.R
          echo "Stage 1.5 substantive audit script found."

      - name: Run Stage 1.5 substantive audit
        run: Rscript R/21_stage1_5_substantive_field_audit.R

      - name: Show summary
        if: always()
        run: |
          echo "===== STAGE 1.5 SUBSTANTIVE AUDIT ====="
          cat outputs/stage1_5_substantive_audit/STAGE1_5_SUMMARY.md || true

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-stage1-5-substantive-audit
          path: outputs/stage1_5_substantive_audit/
          if-no-files-found: warn
          retention-days: 30
