name: Paper1 Stage3J Influence Robustness

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage3j-influence-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::purrr
            any::fixest
      - name: Download latest successful Stage 3G artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow paper1-stage3g.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id" && test "$run_id" != "null"
          mkdir -p outputs/stage3g_final_inference
          gh run download "$run_id" --name paper1-stage3g-final-inference --dir outputs/stage3g_final_inference
      - name: Run transparent influence robustness checks
        run: Rscript R/60_influence_robustness.R
      - name: Show summary
        if: always()
        run: cat outputs/stage3j_influence_robustness/STAGE3J_SUMMARY.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper1-stage3j-influence-robustness
          path: outputs/stage3j_influence_robustness/
          if-no-files-found: warn
          retention-days: 30
